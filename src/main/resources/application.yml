server:
  port: 8090

spring:
  datasource:
    url: jdbc:h2:mem:prices
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
  h2:
    console:
      enabled: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql